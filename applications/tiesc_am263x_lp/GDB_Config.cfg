source [find interface/xds110.cfg]
adapter speed 5500

transport select jtag
reset_config none

set SOC am263
source [find target/ti_k3.cfg]

init

# Clear warm reset causes
write_memory 0x53200010 32 {0x07}

# Tries causing a power on reset by writing 0x7 to the MSS_RCM_R5SS0_POR_RST_CTRL and
# MSS_RCM_R5SS1_POR_RST_CTRL registers.
write_memory 0x53208500 32 0x7
write_memory 0x53208504 32 0x7
sleep 100

# clear POR
write_memory 0x53208500 32 0x0
write_memory 0x53208504 32 0x0

# Reset R5SS0 and R5SS1
write_memory 0x53208500 32 {0x7}
write_memory 0x53208504 32 {0x7}

# Reset all 4 watchdogs
write_memory 0x5320854C 32 {0x7}
write_memory 0x53208550 32 {0x7}
write_memory 0x53208554 32 {0x7}
write_memory 0x53208558 32 {0x7}

# Reset PRU
write_memory 0x532085E4 32 {0x7}

# Set warm reset hold time to 2ms
write_memory 0x53200030 32 {0xCCC}
# Set debugss as valid warm-reset source, and allow warm reset via warm reset pin
write_memory 0x53200004 32 {0x70}
# This is in a catch block because the write performs a warm reset, which cases the interface JTAG to reset immediately causing the write to 'fail'.
catch { write_memory 0x53200008 32 {0x00} }
# Allow time for reset to happen
sleep 50
# Restart debugging
poll
init
halt

# Try to halt core 0, retrying until success.
# Sometimes when the SOPs are set for QSPI boot the application that is loaded causes some issues
# that prevent the debugger from attaching and halting the core. This loop allowed debugging to be started
# and the reset button on the SOM pressed. The debugger can then halt execution before it reaches
# the problematic code. 
# If desired, Debugging can be exited and UniFlash connected to overwrite the problematic code.
set complete 0
while {$complete == 0} {
        catch {
                targets am263.axi_ap
                # Set core halt registers to halt R5 cores
                write_memory 0x50D00024 32 {0x07070707}
                write_memory 0x50D00028 32 {0x07070707}
                write_memory 0x50D00044 32 {0x07070707}
                write_memory 0x50D00048 32 {0x07070707}

                write_memory 0x53200008 32 {0x07}
                targets am263.cpu.main0_r5.0
                r5_up am263.cpu.main0_r5.0
                halt
                set complete 1
        }
}

am263.cpu.main0_r5.0 configure -event step-start {
        am263.cpu.main0_r5.0 cortex_r4 maskisr on
}
am263.cpu.main0_r5.0 configure -event resume-end {
        am263.cpu.main0_r5.0 cortex_r4 maskisr off
}

# Already did r5_up, so get rid of call in gdb-attach
am263.cpu.main0_r5.0 configure -event gdb-attach {halt 1000}
